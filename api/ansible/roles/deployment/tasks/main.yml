- name: Look up environment variables
  set_fact:
    project_name: "{{ lookup('env', 'PROJECT_NAME') | default('', true) }}"
    service_type: "{{ lookup('env', 'SERVICE_TYPE') | default('', true) }}"
    repo_path: "{{ lookup('env', 'CI_PROJECT_PATH') | default('', true) }}"
    app_dir: "/app/{{ lookup('env', 'PROJECT_NAME') | default('', true) }}/{{ lookup('env', 'SERVICE_TYPE') | default('', true) }}"
    ci_branch: "{{ lookup('env', 'CI_COMMIT_REF_NAME') | default('', true) }}"

- name: Debug project_name and app_dir
  debug:
    msg:
      - "Project Name: {{ project_name }}"
      - "App Directory: {{ app_dir }}"
      - "Service Type: {{ service_type }}"

- name: Create app project directory
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    recurse: yes
  no_log: true

- name: Remove existing Docker containers if they exist
  community.docker.docker_container:
    name: "{{ item }}"
    state: absent
  loop:
    - pms_api_dev
  ignore_errors: yes

- name: Clone remote repository into server
  ansible.builtin.git:
    repo: "git@gitlab.camcyber.com:{{ repo_path }}.git"
    dest: "{{ app_dir }}"
    accept_hostkey: true
    version: "{{ ci_branch }}"
    force: yes
  no_log: true


- name: Ensure Docker network exists
  community.docker.docker_network:
    name: camcyber
    state: present

- name: Run docker-compose for {{ service_type }}
  community.docker.docker_compose_v2:
    project_name: "{{ service_type }}"
    recreate: always
    build: always
    definition:
      version: '3.8'
      services:

        pms_api_dev:
          container_name: pms_api_dev
          build:
            context: "{{ app_dir }}"
            dockerfile: DockerfileProd
          volumes:
            - "{{ app_dir }}:/usr/src/app"
          environment:

            NODE_ENV                : "{{ NODE_ENV | default('production') }}"
            ENV                     : "{{ ENV | default('production') }}"
            PORT                    : "{{ PORT | default('3000') }}"
            GLOBAL_PREFIX           : "{{ GLOBAL_PREFIX | default('api') }}"
            SYSTEM_NAME             : "{{ SYSTEM_NAME | default('PMS') }}"
            ENVIRONMENT             : "{{ ENVIRONMENT | default('production') }}"
            VERSION                 : "{{ VERSION | default('v1.0.0') }}"
            TRUST_PROXY             : "{{ TRUST_PROXY | default('') }}"
            SESSION_SECRET_KEY      : "{{ SESSION_SECRET_KEY | default('') }}"
            SESSION_SECRET          : "{{ SESSION_SECRET | default(SESSION_SECRET_KEY | default('')) }}"
            APP_BASE_URL            : "{{ APP_BASE_URL | default('') }}"
            WEB_BASE_URL            : "{{ WEB_BASE_URL | default('') }}"
            FRONTEND_URL            : "{{ FRONTEND_URL | default('') }}"
            SYSTEM_REGISTRATION_URL : "{{ SYSTEM_REGISTRATION_URL | default('') }}"
            # This role deploys PMS development, where Mini App login is enabled.
            TELEGRAM_LOGIN          : "true"
            TELEGRAM_LOGIN_USERNAME : "{{ TELEGRAM_LOGIN_USERNAME | default('') }}"
            ENABLE_DEV_OTP          : "{{ ENABLE_DEV_OTP | default('false') }}"

            # DB Configuration
            DB_CONNECTION           : "{{ DB_CONNECTION | default('postgres') }}"
            DB_HOST                 : "{{ DB_HOST }}"
            DB_PORT                 : "{{ DB_PORT }}"
            DB_USERNAME             : "{{ DB_USERNAME }}"
            DB_PASSWORD             : "{{ DB_PASSWORD }}"
            DB_DATABASE             : "{{ DB_DATABASE }}"
            DB_TIMEZONE             : "{{ DB_TIMEZONE | default('UTC') }}"
            DB_SYNCHRONIZE          : "{{ DB_SYNCHRONIZE | default('false') }}"

            REDIS_HOST              : "{{ REDIS_HOST | default('localhost') }}"
            REDIS_PORT              : "{{ REDIS_PORT | default('6379') }}"

            JWT_SECRET              : "{{ JWT_SECRET }}"
            JWT_EXPIRES             : "{{ JWT_EXPIRES | default('1d') }}"
            JWT_REFRESH_SECRET      : "{{ JWT_REFRESH_SECRET | default(JWT_SECRET) }}"
            JWT_REFRESH_EXPIRES     : "{{ JWT_REFRESH_EXPIRES | default('7d') }}"
            
            OTP_FIXED_CODE          : "{{ OTP_FIXED_CODE | default('') }}"
            QR_HMAC_SECRET          : "{{ QR_HMAC_SECRET | default('') }}"
            WEB_QR_BASE_URL         : "{{ WEB_QR_BASE_URL | default('') }}"
            OTP_SMS_API_URL         : "{{ OTP_SMS_API_URL | default('') }}"
            OTP_SMS_API_TOKEN       : "{{ OTP_SMS_API_TOKEN | default('') }}"
            OTP_GMAIL_HOST          : "{{ OTP_GMAIL_HOST | default('smtp.gmail.com') }}"
            OTP_GMAIL_PORT          : "{{ OTP_GMAIL_PORT | default('465') }}"
            OTP_GMAIL_USER          : "{{ OTP_GMAIL_USER | default('') }}"
            OTP_GMAIL_APP_PASSWORD  : "{{ OTP_GMAIL_APP_PASSWORD | default('') }}"
            OTP_GMAIL_FROM          : "{{ OTP_GMAIL_FROM | default('') }}"

            FILE_BASE_URL           : "{{ FILE_BASE_URL | default('') }}"
            FILE_KEY                : "{{ FILE_KEY | default('') }}"
            FILE_USERNAME           : "{{ FILE_USERNAME | default('') }}"
            FILE_PASSWORD           : "{{ FILE_PASSWORD | default('') }}"
            FILE_UPLOAD_PROJECT_ID  : "{{ FILE_UPLOAD_PROJECT_ID | default('') }}"
            FILE_UPLOAD_FOLDER_ID   : "{{ FILE_UPLOAD_FOLDER_ID | default('') }}"

            JS_BASE_URL             : "{{ JS_BASE_URL | default('') }}"
            JS_USERNAME             : "{{ JS_USERNAME | default('') }}"
            JS_PASSWORD             : "{{ JS_PASSWORD | default('') }}"

            TELEGRAM_GATEWAY_URL    : "{{ TELEGRAM_GATEWAY_URL | default('') }}"
            TELEGRAM_GATEWAY_TOKEN  : "{{ TELEGRAM_GATEWAY_TOKEN | default('') }}"
            TELEGRAM_BOT_TOKEN      : "{{ TELEGRAM_BOT_TOKEN | default('') }}"
            TELEGRAM_CHAT_MAIN_ID   : "{{ TELEGRAM_CHAT_MAIN_ID | default('') }}"
            TELEGRAM_CHAT_LOGS_ID   : "{{ TELEGRAM_CHAT_LOGS_ID | default('') }}"
            TELEGRAM_WEBHOOK_TOKEN  : "{{ TELEGRAM_WEBHOOK_TOKEN | default('') }}"
            ORGANIZATION_LOG_TELEGRAM_BOT_TOKEN : "{{ ORGANIZATION_LOG_TELEGRAM_BOT_TOKEN | default('') }}"
            ORGANIZATION_LOG_TELEGRAM_CHAT_ID   : "{{ ORGANIZATION_LOG_TELEGRAM_CHAT_ID | default('') }}"


            FIREBASE_PROJECT_ID   : "{{ FIREBASE_PROJECT_ID | default('') }}"
            FIREBASE_CLIENT_EMAIL   : "{{ FIREBASE_CLIENT_EMAIL | default('') }}"
            FIREBASE_PRIVATE_KEY   : "{{ FIREBASE_PRIVATE_KEY | default('') }}"


            FIREBASE_WEB_API_KEY   : "{{ FIREBASE_WEB_API_KEY | default('') }}"
            FIREBASE_WEB_AUTH_DOMAIN   : "{{ FIREBASE_WEB_AUTH_DOMAIN | default('') }}"
            FIREBASE_WEB_STORAGE_BUCKET   : "{{ FIREBASE_WEB_STORAGE_BUCKET | default('') }}"
            FIREBASE_WEB_MESSAGING_SENDER_ID   : "{{ FIREBASE_WEB_MESSAGING_SENDER_ID | default('') }}"
            FIREBASE_WEB_APP_ID   : "{{ FIREBASE_WEB_APP_ID | default('') }}"
            FIREBASE_WEB_VAPID_KEY   : "{{ FIREBASE_WEB_VAPID_KEY | default('') }}"


            GOOGLE_CLIENT_ID   : "{{ GOOGLE_CLIENT_ID | default('') }}"


            SES_SMTP_HOST   : "{{ SES_SMTP_HOST | default('') }}"
            SES_SMTP_PORT   : "{{ SES_SMTP_PORT | default('') }}"
            SES_SMTP_USERNAME   : "{{ SES_SMTP_USERNAME | default('') }}"
            SES_SMTP_PASSWORD   : "{{ SES_SMTP_PASSWORD | default('') }}"
            SES_FROM_EMAIL   : "{{ SES_FROM_EMAIL | default('') }}"


            WEBAUTHN_RP_ID   : "{{ WEBAUTHN_RP_ID | default('') }}"
            WEBAUTHN_RP_NAME   : "{{ WEBAUTHN_RP_NAME | default('') }}"
            WEBAUTHN_ORIGIN   : "{{ WEBAUTHN_ORIGIN | default('') }}"


            PUBLIC_URL   : "{{ PUBLIC_URL | default('') }}"

            KLIPY_API_KEY   : "{{ KLIPY_API_KEY | default('') }}"

            SSO_ISSUER_URL   : "{{ SSO_ISSUER_URL | default('') }}"
            SSO_CLIENT_ID   : "{{ SSO_CLIENT_ID | default('') }}"
            SSO_ALLOWED_AUD   : "{{ SSO_ALLOWED_AUD | default('') }}"

          ports:
            - '2410:3000'
          networks:
            - camcyber
      volumes:
        volume:
      networks:
        camcyber:
          external: true
  no_log: true
