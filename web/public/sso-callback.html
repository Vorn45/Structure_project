<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>Signing in…</title>
    <script>
        // CDC SSO (Keycloak) redirect landing page. Keycloak returns here with
        // ?code&state in a normal query string. The PMS app uses hash routing,
        // so forward into the in-app hash route, carrying the query along.
        (function () {
            var search = window.location.search || '';
            var target = '/#/auth/sso-callback' + search;
            window.location.replace(target);
        })();
    </script>
</head>
<body></body>
</html>
