image:
  name: gitlab.camcyber.com:5050/camcyber/registry/node:v20-alpine
  pull_policy: always

stages:
  - "audit"
  - "build:dev"
  - "build:production"
  - "deploy:dev"
  - "deploy:production"

include:
  - local: 'pipelines/dev.gitlab-ci.yml'
    rules:
      - if: '$CI_COMMIT_BRANCH == "dev"'

  - local: 'pipelines/prod.gitlab-ci.yml'
    rules:
      - if: '$CI_COMMIT_BRANCH == "prod"'