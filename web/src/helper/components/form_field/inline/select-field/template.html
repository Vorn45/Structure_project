<div
    class="w-full flex justify-between items-start py-2 cursor-pointer relative"
    (click)="!isEditing ? onToggleEdit() : openDropdown()"
>
    <div class="w-full flex items-start pl-4 gap-2 group">
        <!-- Icon -->
        <div
            class="min-w-10 h-10 flex items-center justify-center group-hover:bg-primary rounded-full"
            [ngClass]="isEditing ? 'bg-primary-100' : 'bg-[#f3f4f5]'"
        >
            <mat-icon
                [svgIcon]="icon"
                class="icon-size-6 group-hover:text-white"
                [ngClass]="isEditing ? 'text-primary' : 'text-slate-500'"
            >
            </mat-icon>
        </div>

        <!-- Label + Value/Input -->
        <div class="w-full flex flex-col items-start justify-center">
            <!-- Label Text -->
            <span class="text-sm leading-4 text-slate-500 group-hover:text-slate-900">
                {{ label }}
                @if (required) {
                    <span class="text-sm leading-4 text-warn-500">*</span>
                }
            </span>

            <!-- View Mode -->
            <span
                *ngIf="!isEditing"
                class="w-full text-lg leading-6 group-hover:text-primary group-hover:font-medium"
                [ngClass]="formControl?.value ? 'text-slate-900' : 'text-[#94A3B8]'"
            >
                {{ getDisplayLabel(formControl?.value) || placeholder }}
            </span>

            <!-- Edit Mode -->
            <div *ngIf="isEditing" class="w-full flex items-center gap-1">
                <span
                    class="text-lg leading-6 group-hover:text-primary"
                    [ngClass]="formControl?.value ? 'text-slate-900' : 'text-[#94A3B8]'"
                >
                    {{ getDisplayLabel(formControl?.value) || activePlaceholder }}
                </span>

                <mat-icon
                    svgIcon="mdi:arrow-down-drop"
                    class="icon-size-6 group-hover:text-primary"
                >
                </mat-icon>

                <!-- Hidden select element -->
                <mat-select
                    #selectEl
                    [formControl]="formControl"
                    [panelClass]="enableSearch && hasOptions ? 'select-panel-with-search' : ''"
                    (selectionChange)="onOptionSelected()"
                    (openedChange)="!$event && onDropdownClosed()"
                    class="min-w-0 max-w-[80%] mt-6"
                    style="opacity: 0; position: absolute; pointer-events: none"
                >
                    <!-- Search Input (only if enabled and has options) -->
                    <div
                        *ngIf="enableSearch && hasOptions"
                        class="p-4 mb-2 sticky top-0 bg-white z-10 border-b"
                    >
                        <input
                            type="text"
                            [(ngModel)]="searchTerm"
                            [ngModelOptions]="{ standalone: true }"
                            (click)="$event.stopPropagation()"
                            [placeholder]="searchPlaceholder"
                            class="w-full px-3 py-2 border rounded-md outline-none focus:border-primary"
                        />
                    </div>

                    <!-- Options -->
                    <ng-container *ngIf="hasOptions">
                        <mat-option
                            class="text-lg"
                            *ngFor="let option of filteredOptions"
                            [value]="option[optionValue]"
                        >
                            {{ option[optionLabel] }}
                        </mat-option>
                    </ng-container>

                    <!-- Dummy disabled option to allow dropdown to open when no data -->
                    <mat-option *ngIf="!hasOptions" [disabled]="true" style="display: none">
                        <!-- This ensures mat-select can open -->
                    </mat-option>

                    <!-- No Search Results (when searching returns empty) -->
                    <div
                        *ngIf="enableSearch && hasOptions && filteredOptions.length === 0"
                        class="px-4 py-8 text-center text-gray-500"
                    >
                        {{ noResultsText }}
                    </div>

                    <!-- No Data Available (when options array is empty) -->
                    <div *ngIf="!hasOptions" class="px-4 py-8 text-center text-gray-500">
                        {{ noDataText }}
                    </div>
                </mat-select>
            </div>
        </div>

        <div
            *ngIf="!isEditing"
            class="min-w-10 h-10 flex items-center justify-center mr-2 opacity-0 group-hover:opacity-100"
        >
            <mat-icon svgIcon="mdi:pencil-outline" class="icon-size-6"></mat-icon>
        </div>
    </div>

    <!-- Close/Exit Edit Icon -->
    <div
        *ngIf="isEditing"
        class="absolute top-1 right-0 min-w-12 h-12 flex items-center justify-center mr-1 rounded-full cursor-pointer group"
        (click)="onToggleEdit(); $event.stopPropagation()"
    >
        <div
            class="min-w-10 h-10 flex items-center justify-center rounded-full group-hover:bg-warn-100"
        >
            <mat-icon svgIcon="mdi:close" class="icon-size-6 group-hover:text-warn"></mat-icon>
        </div>
    </div>
</div>
