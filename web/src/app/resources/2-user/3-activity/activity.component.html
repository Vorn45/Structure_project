<div
    class="flex flex-col flex-1 min-w-0 w-full p-4 bg-slate-100/70 dark:bg-slate-900/60 font-normal text-[16px] box-border"
    style="min-height: 100vh;">

    <!-- ===== FRAMED CONTENT CONTAINER ===== -->
    <div
        class="flex flex-col flex-1 min-w-0 bg-white dark:bg-slate-800 rounded-xl border border-slate-200 dark:border-slate-700 shadow-sm p-4 sm:p-6"
        style="min-height: calc(100vh - 2rem);">
        <!-- Header -->
        <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 mb-6">
            <div>
                <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
                    Activity Feed
                </h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-1">
                    Real-time chronological timeline of your actions, task assignments, and security events.
                </p>
            </div>

            <button mat-stroked-button class="rounded-xl border-slate-200 dark:border-slate-700 self-start sm:self-auto"
                (click)="loadActivities()">
                <mat-icon svgIcon="mdi:refresh"></mat-icon>
                <span>Refresh</span>
            </button>
        </div>

        <!-- Filter Pills -->
        <div class="flex items-center gap-2 mb-8 overflow-x-auto pb-2 sm:pb-0">
            <button class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all border whitespace-nowrap"
                [ngClass]="selectedType() === 'all' ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-transparent shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700'"
                (click)="filterByType('all')">
                All Activity
            </button>
            <button class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all border whitespace-nowrap"
                [ngClass]="selectedType() === 'task' ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-transparent shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700'"
                (click)="filterByType('task')">
                Tasks
            </button>
            <button class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all border whitespace-nowrap"
                [ngClass]="selectedType() === 'project' ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-transparent shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700'"
                (click)="filterByType('project')">
                Projects
            </button>
            <button class="px-3.5 py-1.5 rounded-xl text-xs font-semibold transition-all border whitespace-nowrap"
                [ngClass]="selectedType() === 'security' ? 'bg-slate-900 dark:bg-white text-white dark:text-slate-900 border-transparent shadow-sm' : 'bg-white dark:bg-slate-800 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-700'"
                (click)="filterByType('security')">
                Security
            </button>
        </div>

        <!-- Loading Spinner -->
        <div *ngIf="loading()" class="flex justify-center items-center py-24">
            <mat-progress-spinner mode="indeterminate" diameter="48"></mat-progress-spinner>
        </div>

        <!-- Activity Timeline -->
        <div *ngIf="!loading()" class="max-w-3xl">
            <div *ngIf="activities().length === 0"
                class="text-center py-16 bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-8">
                <mat-icon svgIcon="mdi:history" class="icon-size-12 text-slate-300 dark:text-slate-600 mb-3"></mat-icon>
                <h3 class="text-base font-bold text-slate-900 dark:text-white">No activity found</h3>
                <p class="text-xs text-slate-500 dark:text-slate-400 mt-1">There are no events recorded matching the
                    selected filter.</p>
            </div>

            <div
                class="relative pl-6 space-y-6 before:absolute before:left-2.5 before:top-3 before:bottom-3 before:w-0.5 before:bg-slate-200 dark:before:bg-slate-700">
                <div *ngFor="let item of activities()" class="relative flex items-start gap-4 group">
                    <!-- Timeline Marker Icon -->
                    <div class="absolute -left-6 top-1 w-5 h-5 rounded-full ring-4 ring-slate-50 dark:ring-slate-900 flex items-center justify-center shadow-xs"
                        [ngClass]="getIconClass(item.type)">
                        <mat-icon [svgIcon]="item.icon" class="icon-size-3"></mat-icon>
                    </div>

                    <!-- Event Card -->
                    <div
                        class="flex-1 rounded-2xl border border-slate-200/80 dark:border-slate-800/80 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md p-4 sm:p-5 shadow-xs hover:shadow-md transition-all">
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-1 mb-1.5">
                            <h4 class="text-sm font-bold text-slate-900 dark:text-white">
                                {{ item.title }}
                            </h4>
                            <span class="text-xs text-slate-400 dark:text-slate-500">
                                {{ item.created_at | date:'medium' }}
                            </span>
                        </div>

                        <p class="text-xs text-slate-600 dark:text-slate-300 leading-relaxed">
                            {{ item.description }}
                        </p>

                        <div *ngIf="item.target"
                            class="mt-3 pt-2.5 border-t border-slate-100 dark:border-slate-700/60 flex items-center gap-2">
                            <span class="text-2xs font-bold uppercase tracking-wider text-slate-400">Target</span>
                            <span
                                class="text-xs font-semibold text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-950/30 px-2 py-0.5 rounded-md">
                                {{ item.target.name }}
                            </span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
