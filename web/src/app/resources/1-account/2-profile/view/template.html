<div class="w-full h-full flex flex-col bg-[#f8fafc] dark:bg-slate-950 text-slate-800 dark:text-slate-100 font-kantumruy select-none">
    <!-- Header -->
    <div class="w-full flex items-center justify-between px-6 py-4 border-b border-slate-200/80 dark:border-slate-800 bg-white dark:bg-slate-900 shrink-0">
        <span class="text-[17px] font-semibold text-slate-800 dark:text-slate-100">
            {{ 'ProfileView.Title' | transloco }}
        </span>
        <button type="button" (click)="closeDrawer()"
            class="size-8 rounded-full flex items-center justify-center text-slate-400 hover:text-slate-600 hover:bg-slate-100 dark:hover:bg-slate-800 dark:hover:text-slate-200 transition-colors">
            <mat-icon svgIcon="feather:x" class="!w-4 !h-4"></mat-icon>
        </button>
    </div>

    <!-- Main Scrollable Content -->
    <div class="flex-1 overflow-y-auto px-5 py-4 space-y-4">

        <!-- 1. Top Profile Card -->
        <div class="w-full bg-white dark:bg-slate-900 rounded-2xl p-4 border border-slate-200/70 dark:border-slate-800 shadow-sm flex items-center justify-between gap-3">
            <!-- Left Avatar & Info -->
            <div class="flex items-center gap-3.5 min-w-0 flex-1">
                <!-- Avatar with Online Dot -->
                <div class="relative size-12 shrink-0 rounded-full cursor-pointer group" (click)="uploadProfileDialog()" [matTooltip]="'ProfileView.ChangeAvatar' | transloco">
                    <img [src]="getImageUrl(user?.avatar, 'avatar')" alt="Avatar"
                        class="size-full rounded-full object-cover border border-slate-200 dark:border-slate-700 block"
                        [class.opacity-40]="isAvatarUpdating" />
                    
                    <div *ngIf="isAvatarUpdating"
                        class="absolute inset-0 z-10 flex items-center justify-center rounded-full bg-black/40">
                        <mat-progress-spinner diameter="20" mode="indeterminate"></mat-progress-spinner>
                    </div>

                    <!-- Online Status Indicator -->
                    <span *ngIf="!isAvatarUpdating"
                        class="absolute bottom-0 right-0 size-3.5 bg-emerald-500 rounded-full border-2 border-white dark:border-slate-900">
                    </span>
                </div>

                <!-- Name, Email, Role Tag -->
                <div class="flex flex-col min-w-0 flex-1">
                    <span class="text-[15px] font-semibold text-slate-900 dark:text-white truncate leading-snug">
                        {{ user?.kh_name || user?.name || ('ProfileView.DefaultUserName' | transloco) }}
                    </span>
                    <span class="text-[12px] text-slate-500 dark:text-slate-400 truncate mt-0.5">
                        {{ user?.email || 'chanthon.sok@digitechkh.com' }}
                    </span>
                    <div class="mt-1.5 flex items-center">
                        <span class="inline-flex items-center gap-1.5 px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-emerald-50 text-emerald-600 border border-emerald-200/80 dark:bg-emerald-950/40 dark:text-emerald-400 dark:border-emerald-800">
                            <span class="size-1.5 rounded-full bg-emerald-500"></span>
                            <span>{{ activeRoleLabel }}</span>
                        </span>
                    </div>
                </div>
            </div>

            <!-- Edit Button -->
            <button type="button" (click)="updateProfile()"
                [matTooltip]="'ProfileView.EditAccountInfo' | transloco"
                class="size-9 rounded-xl border border-slate-200 dark:border-slate-700 flex items-center justify-center text-slate-500 hover:text-slate-800 hover:bg-slate-50 dark:text-slate-400 dark:hover:text-slate-100 dark:hover:bg-slate-800 shrink-0 transition-colors shadow-none">
                <mat-icon svgIcon="mdi:pencil-outline" class="!w-4 !h-4 text-slate-500 dark:text-slate-400"></mat-icon>
            </button>
        </div>

        <!-- 2. Organization / Workspace Card -->
        <div (click)="openOrgDialog()"
            class="w-full bg-white dark:bg-slate-900 rounded-2xl p-3.5 border border-slate-200/70 dark:border-slate-800 shadow-sm flex items-center gap-3.5 cursor-pointer hover:border-emerald-300 dark:hover:border-emerald-700 transition-all group">
            <div class="size-10 rounded-xl bg-emerald-600 flex items-center justify-center text-white shrink-0 shadow-sm">
                <mat-icon svgIcon="heroicons_outline:building-office-2" class="!w-5 !h-5 text-white"></mat-icon>
            </div>
            <div class="flex-1 min-w-0">
                <p class="text-[14px] font-semibold text-slate-800 dark:text-white truncate leading-tight group-hover:text-emerald-600 dark:group-hover:text-emerald-400 transition-colors">
                    {{ activeOrgTitle }}
                </p>
                <p class="text-[12px] text-slate-500 dark:text-slate-400 truncate mt-0.5">
                    {{ activeOrgSubtitle }}
                </p>
            </div>
            <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 transition-colors shrink-0"></mat-icon>
        </div>

        <!-- 3. Section: គណនី (Account) -->
        <div class="pt-2">
            <p class="text-[12px] font-medium text-slate-400 dark:text-slate-500 px-1 mb-2 tracking-wide uppercase">
                គណនី
            </p>
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/70 dark:border-slate-800 overflow-hidden shadow-sm divide-y divide-slate-100 dark:divide-slate-800/80">
                <!-- Row 1: កម្រងព័ត៌មានផ្ទាល់ខ្លួន -->
                <button type="button" (click)="openPersonalProfile()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-blue-50 text-blue-600 dark:bg-blue-950/40 dark:text-blue-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:user" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                កម្រងព័ត៌មានផ្ទាល់ខ្លួន
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                ព័ត៌មានគណនី និងការអនុញ្ញាត
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>

                <!-- Row 2: ប្តូរពាក្យសម្ងាត់ -->
                <button type="button" (click)="openPasswordDialog()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-amber-50 text-amber-600 dark:bg-amber-950/40 dark:text-amber-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:key" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                ប្តូរពាក្យសម្ងាត់
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                សុវត្ថិភាព និងលេខសម្ងាត់
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>

                <!-- Row 3: ការជូនដំណឹង -->
                <button type="button" (click)="openNotifications()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-orange-50 text-orange-600 dark:bg-orange-950/40 dark:text-orange-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:bell" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                ការជូនដំណឹង
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                កំណត់ការទទួលដំណឹងផ្សេងៗ
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>
            </div>
        </div>

        <!-- 4. Section: ការគ្រប់គ្រង (Management) -->
        <div class="pt-2">
            <p class="text-[12px] font-medium text-slate-400 dark:text-slate-500 px-1 mb-2 tracking-wide uppercase">
                ការគ្រប់គ្រង
            </p>
            <div class="bg-white dark:bg-slate-900 rounded-2xl border border-slate-200/70 dark:border-slate-800 overflow-hidden shadow-sm divide-y divide-slate-100 dark:divide-slate-800/80">
                <!-- Row 1: ព័ត៌មានក្រុមហ៊ុន -->
                <button type="button" (click)="openCompanyInfo()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-indigo-50 text-indigo-600 dark:bg-indigo-950/40 dark:text-indigo-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:building-office-2" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                ព័ត៌មានក្រុមហ៊ុន
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                សាខា អាសយដ្ឋាន និងទិន្នន័យ
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>

                <!-- Row 2: អ្នកប្រើប្រាស់ និងសិទ្ធិ -->
                <button type="button" (click)="openUsersAndPermissions()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-sky-50 text-sky-600 dark:bg-sky-950/40 dark:text-sky-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:users" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                អ្នកប្រើប្រាស់ និងសិទ្ធិ
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                គ្រប់គ្រងសមាជិក និងតួនាទី
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>

                <!-- Row 3: ការកំណត់ពន្ធ -->
                <button type="button" (click)="openTaxSettings()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-emerald-50 text-emerald-600 dark:bg-emerald-950/40 dark:text-emerald-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:receipt-percent" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                ការកំណត់ពន្ធ
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                អត្រាពន្ធ និងរបបពន្ធសាជីវកម្ម
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>

                <!-- Row 4: ការកំណត់ប្រព័ន្ធ -->
                <button type="button" (click)="openSystemSettings()"
                    class="w-full flex items-center justify-between p-3.5 text-left hover:bg-slate-50 dark:hover:bg-slate-800/50 transition-colors group">
                    <div class="flex items-center gap-3.5 min-w-0">
                        <div class="size-9 rounded-xl bg-purple-50 text-purple-600 dark:bg-purple-950/40 dark:text-purple-400 flex items-center justify-center shrink-0">
                            <mat-icon svgIcon="heroicons_outline:adjustments-horizontal" class="!w-5 !h-5"></mat-icon>
                        </div>
                        <div class="min-w-0">
                            <p class="text-[14px] font-medium text-slate-800 dark:text-slate-100 leading-tight">
                                ការកំណត់ប្រព័ន្ធ
                            </p>
                            <p class="text-[12px] text-slate-400 dark:text-slate-500 mt-0.5 truncate">
                                ភាសា វគ្គវិជ្ជា និងទម្រង់
                            </p>
                        </div>
                    </div>
                    <mat-icon svgIcon="heroicons_outline:chevron-right" class="!w-4 !h-4 text-slate-300 dark:text-slate-600 group-hover:text-slate-500 shrink-0"></mat-icon>
                </button>
            </div>
        </div>

        <!-- 5. Sign Out Button -->
        <div class="pt-2">
            <button type="button" (click)="signOut()"
                class="w-full h-11 px-4 rounded-2xl font-medium text-[14px] flex items-center justify-center gap-2 text-rose-600 bg-rose-50/70 hover:bg-rose-100/70 border border-rose-200/60 dark:bg-rose-950/30 dark:hover:bg-rose-950/50 dark:border-rose-900/60 dark:text-rose-400 transition-all duration-200 active:scale-[0.99]">
                <mat-icon svgIcon="mdi:logout" class="!w-4 !h-4 text-rose-500 dark:text-rose-400 shrink-0"></mat-icon>
                <span>{{ 'Lock.SignOut' | transloco }}</span>
            </button>
        </div>

    </div>

    <!-- Bottom Footer Version -->
    <div class="w-full py-3.5 text-center shrink-0 border-t border-slate-200/60 dark:border-slate-800/80 bg-white/60 dark:bg-slate-900/60">
        <span class="text-[12px] text-slate-400 dark:text-slate-500 tracking-wide font-normal">
            DIGITECHKH • កំណែ 1.0
        </span>
    </div>
</div>
