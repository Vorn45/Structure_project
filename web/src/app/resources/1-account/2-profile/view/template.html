
<div mat-dialog-title
    class="w-full flex justify-center items-center min-h-14 max-h-14 h-14 border-b border-slate-200 dark:border-white/10 m-0 !py-0 font-kantumruy bg-white dark:bg-slate-900 relative px-4">
    <span class="w-full text-center text-2xl font-medium font-kantumruy text-slate-500 dark:text-slate-400">{{ 'ProfileView.Title' | transloco }}</span>
</div>

<shared-side-dialog-close-button [isReturn]="false"></shared-side-dialog-close-button>

<mat-dialog-content class="w-full !p-0 overflow-y-auto flex-1 pb-4">
    <!-- Cover Image -->
    <div
        class="relative w-full h-48 group flex items-center justify-center border-b border-slate-200 dark:border-slate-700">
        <img [src]="getImageUrl(user?.cover, 'cover')" alt="cover" class="w-full h-full object-cover" />
        <div
            class="absolute inset-0 flex items-center justify-center bg-black bg-opacity-50 opacity-0 group-hover:opacity-100 transition-opacity">
            <mat-icon class="icon-size-12 text-white" svgIcon="mdi:upload"></mat-icon>
        </div>
        <input type="file" accept="image/*" (change)="openCroppedDialog($event, 2/1, 'cover')"
            class="absolute inset-0 opacity-0 cursor-pointer" />
    </div>

    <!-- Profile Header (Avatar, Info & Action Buttons) -->
    <div class="flex items-start justify-between px-6 -mt-12 relative z-10 gap-4">
        <!-- Left: Avatar + User Info -->
        <div class="flex items-start gap-4 min-w-0 flex-1">
            <!-- Profile Image -->
            <div
                class="relative size-24 shrink-0 rounded-full group flex items-center justify-center border-4 border-white dark:border-slate-900 bg-white shadow-sm">
                <img [src]="getImageUrl(user?.avatar, 'avatar')" alt="Profile Picture"
                    class="size-full rounded-full object-cover transition duration-300"
                    [class.opacity-40]="isAvatarUpdating" />

                <!-- Loading Spinner Overlay -->
                <div *ngIf="isAvatarUpdating"
                    class="absolute inset-0 z-10 flex items-center justify-center rounded-full bg-gray-500/50 backdrop-blur-[1px]">
                    <mat-progress-spinner diameter="34" mode="indeterminate"></mat-progress-spinner>
                </div>

                <!-- Upload Icon Overlay -->
                <div *ngIf="!isAvatarUpdating"
                    class="absolute inset-0 rounded-full flex items-center justify-center bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity cursor-pointer"
                    (click)="uploadProfileDialog()">
                    <mat-icon class="!w-7 !h-7 text-white" svgIcon="mdi:upload"></mat-icon>
                </div>
                <!-- Verification Badge -->
                <div *ngIf="!isAvatarUpdating"
                    class="absolute -bottom-0.5 -right-0.5 size-7 bg-amber-500 rounded-full flex items-center justify-center border-2 border-white dark:border-slate-900">
                    <mat-icon svgIcon="mdi:shield-check" class="text-white !w-4 !h-4"></mat-icon>
                </div>
            </div>

            <!-- User Info -->
            <div class="flex flex-col min-w-0 pt-[52px] flex-1">
                <!-- Main Text (KH Name) - 24px font size, 32px line height -->
                <span class="text-[24px] leading-[32px] font-medium text-slate-900 dark:text-white truncate">
                    {{ user?.kh_name || ('ProfileView.DefaultUserName' | transloco) }}
                </span>
                <!-- Sub Text (EN Name + Gender) - 16px font size, 24px line height, text-slate-900 -->
                <div class="flex items-center gap-1.5 text-[16px] leading-[24px] text-slate-900 dark:text-slate-100">
                    <span class="truncate tracking-wide font-normal text-slate-900 dark:text-slate-100">{{
                        user?.en_name?.toUpperCase() }}</span>
                    <mat-icon *ngIf="genderIcon" [svgIcon]="genderIcon"
                        class="icon-size-4 !w-4 !h-4 text-slate-500 dark:text-slate-400 shrink-0"></mat-icon>
                    <a *ngIf="user?.telegram_username" [href]="'https://t.me/' + user?.telegram_username"
                        target="_blank" rel="noopener noreferrer"
                        class="text-blue-500 font-light hover:text-blue-600 hover:underline cursor-pointer transition-all ml-1.5 text-[14px]"
                        [matTooltip]="'ProfileView.OpenTelegram' | transloco"
                        (click)="$event.stopPropagation()">
                        {{ '@' + user?.telegram_username }}
                    </a>
                </div>
                <!-- Additional Info (Phone & Email) - 12px font size, 24px line height, 16px icons (text-slate-500) -->
                <div
                    class="flex flex-row flex-wrap items-center gap-x-2 gap-y-0.5 text-[12px] leading-[24px] text-slate-500 dark:text-slate-400 overflow-hidden">
                    <ng-container *ngIf="user?.phone">
                        <div class="flex items-center gap-1.5 shrink-0">
                            <mat-icon svgIcon="mdi:phone-outline"
                                class="icon-size-4 !w-4 !h-4 text-slate-500 dark:text-slate-400 shrink-0"></mat-icon>
                            <span class="font-normal text-[12px] text-slate-500 dark:text-slate-400">{{ user?.phone
                                }}</span>
                        </div>
                    </ng-container>
                    <span *ngIf="user?.phone && user?.email"
                        class="shrink-0 text-slate-500 dark:text-slate-400">•</span>
                    <ng-container *ngIf="user?.email">
                        <div class="flex items-center gap-1.5 min-w-0 truncate">
                            <mat-icon svgIcon="mdi:email-outline"
                                class="icon-size-4 !w-4 !h-4 text-slate-500 dark:text-slate-400 shrink-0"></mat-icon>
                            <span class="truncate font-normal text-[12px] text-slate-500 dark:text-slate-400">{{
                                user?.email }}</span>
                        </div>
                    </ng-container>
                </div>
            </div>
        </div>

        <!-- Right: Edit Profile (inline from sm: and up; lives in the top-right menu on mobile) -->
        <div class="hidden sm:flex items-center self-stretch shrink-0 pt-[52px]">
            <!-- Icon only, so the tooltip and aria-label carry the name for
                 pointer and screen-reader users alike. -->
            <button type="button" (click)="updateProfile()"
                [matTooltip]="'ProfileView.EditAccountInfo' | transloco"
                [attr.aria-label]="'ProfileView.EditAccountInfo' | transloco"
                class="w-10 h-10 rounded-xl flex items-center justify-center text-slate-500 hover:text-slate-900 hover:bg-slate-100 dark:text-slate-400 dark:hover:text-white dark:hover:bg-slate-800 transition-all duration-200 active:scale-[0.96] cursor-pointer">
                <mat-icon svgIcon="bx:edit-alt" class="!w-5 !h-5 shrink-0"></mat-icon>
            </button>
        </div>
    </div>
</mat-dialog-content>
