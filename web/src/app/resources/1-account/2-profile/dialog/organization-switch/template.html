<div mat-dialog-title
    class="relative !flex !h-14 !w-full !items-center !justify-between !border-0 !px-5 font-kantumruy">
    <span
        class="w-full text-center text-2xl font-medium font-kantumruy text-slate-500 dark:text-slate-300">{{ 'OrganizationSwitch.Title' | transloco }}</span>
    <button type="button" mat-icon-button (click)="close()"
        class="absolute right-3 top-2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200">
        <mat-icon svgIcon="mdi:close"></mat-icon>
    </button>
</div>

<mat-dialog-content class="!p-0 font-kantumruy">
    <!-- Search Input -->
    <div
        class="flex items-center gap-2 px-3.5 py-2.5 rounded-xl bg-slate-100/90 dark:bg-slate-800 mb-3 border border-slate-200/80 dark:border-slate-700">
        <mat-icon svgIcon="feather:search" class="!w-5 !h-5 text-slate-400 shrink-0"></mat-icon>
        <input type="text" [(ngModel)]="searchQuery" [placeholder]="'OrganizationSwitch.NamePlaceholder' | transloco"
            class="w-full bg-transparent border-0 outline-none text-[15px] text-slate-800 dark:text-slate-100 placeholder:text-slate-400 font-normal font-kantumruy" />
    </div>

    <!-- Organizations List -->
    <div class="max-h-[380px] overflow-y-auto flex flex-col gap-1 [scrollbar-width:none] [&::-webkit-scrollbar]:hidden">
        <ng-container *ngFor="let item of filteredRoles; trackBy: trackRole">
            <div (click)="selectRole(item)"
                class="group flex items-center gap-3 px-3 py-2.5 transition-colors duration-200 rounded-xl hover:bg-slate-100 dark:hover:bg-white/5"
                [ngClass]="item.isActive ? 'bg-slate-100 dark:bg-slate-800' : 'cursor-pointer'">
                <div class="relative shrink-0">
                    <ng-container *ngIf="item.logo; else roleIcon">
                        <img [src]="item.logo" alt="logo"
                            class="h-10 w-10 rounded-full object-contain bg-white border border-slate-200 dark:border-slate-600" />
                        <span *ngIf="item.badgeImage || item.badgeIcon"
                            class="absolute -bottom-1 -right-1 h-5 w-5 rounded-full flex items-center justify-center overflow-hidden"
                            [ngClass]="item.badgeBgClass || 'bg-amber-500 border border-white dark:border-slate-800'">
                            <img *ngIf="item.badgeImage; else badgeIconTpl" [src]="item.badgeImage" alt="avatar"
                                class="h-full w-full object-cover" />
                            <ng-template #badgeIconTpl>
                                <mat-icon [ngClass]="[item.badgeSize || 'icon-size-3', item.badgeColor || 'text-white']"
                                    [svgIcon]="item.badgeIcon"></mat-icon>
                            </ng-template>
                        </span>
                    </ng-container>
                    <ng-template #roleIcon>
                        <span
                            class="h-10 w-10 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center">
                            <mat-icon class="icon-size-6"
                                [ngClass]="item.badgeColor || 'text-slate-500 dark:text-slate-300'"
                                [svgIcon]="item.icon || 'mdi:account-circle'"></mat-icon>
                        </span>
                    </ng-template>
                </div>
                <div class="flex-1 min-w-0 flex flex-col justify-center leading-tight">
                    <p class="truncate text-[15px] font-medium font-kantumruy"
                        [ngClass]="item.isActive ? 'text-blue-900 dark:text-blue-300 font-semibold' : 'text-slate-800 dark:text-slate-100'">
                        {{ item.title }}
                    </p>
                    <p *ngIf="item.subtitle"
                        class="truncate text-[13px] font-normal text-slate-400 dark:text-slate-400 mt-0.5 font-kantumruy">
                        {{ item.subtitle }}
                    </p>
                </div>
                <div class="shrink-0 flex items-center justify-center w-9 min-w-[36px]">
                    <ng-container *ngIf="item.isActive; else nonActiveTpl">
                        <mat-icon class="text-blue-900 dark:text-blue-300 shrink-0" svgIcon="feather:check"></mat-icon>
                    </ng-container>
                    <ng-template #nonActiveTpl>
                        <span *ngIf="item.switchedAt && !dialogMenuTrigger.menuOpen"
                            class="text-[15px] font-normal text-slate-400 dark:text-slate-400 font-kantumruy w-9 text-center block group-hover:hidden">
                            {{ item.switchedAt | timeAgo }}
                        </span>
                        <button type="button" #dialogMenuTrigger="matMenuTrigger"
                            [matMenuTriggerFor]="dialogOrgRowMenu" [matMenuTriggerData]="{ item: item }"
                            (click)="$event.stopPropagation()"
                            class="items-center justify-center text-slate-500 hover:text-slate-700 dark:text-slate-400 dark:hover:text-slate-200 shrink-0 size-8 !p-0 rounded-full aspect-square bg-slate-100 hover:bg-slate-200 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors cursor-pointer border-0 outline-none"
                            [ngClass]="dialogMenuTrigger.menuOpen ? 'flex' : 'hidden group-hover:flex'">
                            <mat-icon svgIcon="feather:more-vertical" class="!w-4 !h-4"></mat-icon>
                        </button>
                    </ng-template>
                </div>
            </div>
        </ng-container>

        <p *ngIf="!filteredRoles.length"
            class="py-8 text-center text-[14px] text-slate-500 dark:text-slate-400 font-kantumruy">
            {{ 'OrganizationSwitch.NoData' | transloco }}
        </p>
    </div>
</mat-dialog-content>

<!-- Row Context Menu -->
<mat-menu #dialogOrgRowMenu="matMenu" xPosition="before"
    class="!rounded-lg !p-0 overflow-hidden border border-slate-200 dark:border-slate-800">
    <ng-template matMenuContent let-item="item">
        <button mat-menu-item (click)="selectRole(item)" class="!h-11 !min-h-11">
            <div
                class="flex items-center gap-3 text-[15px] font-normal text-slate-800 dark:text-slate-100 font-kantumruy">
                <mat-icon svgIcon="mdi:login"
                    class="text-slate-600 dark:text-slate-300 !w-5 !h-5 !mr-0 !m-0 shrink-0"></mat-icon>
                <span>{{ 'OrganizationSwitch.SwitchTo' | transloco }}</span>
            </div>
        </button>

        <button mat-menu-item (click)="openAboutOrg(item)" class="!h-11 !min-h-11">
            <div
                class="flex items-center gap-3 text-[15px] font-normal text-slate-800 dark:text-slate-100 font-kantumruy">
                <mat-icon svgIcon="mdi:information-outline"
                    class="text-slate-600 dark:text-slate-300 !w-5 !h-5 !mr-0 !m-0 shrink-0"></mat-icon>
                <span>{{ 'OrganizationSwitch.About' | transloco }}</span>
            </div>
        </button>

        <button mat-menu-item (click)="leaveOrg(item)" class="!h-11 !min-h-11">
            <div class="flex items-center gap-3 text-[15px] font-normal text-red-500 font-kantumruy">
                <mat-icon svgIcon="mdi:exit-run" class="!text-red-500 !w-5 !h-5 !mr-0 !m-0 shrink-0"></mat-icon>
                <span class="text-red-500">{{ 'LeaveOrg.Leave' | transloco }}</span>
            </div>
        </button>
    </ng-template>
</mat-menu>
