<div mat-dialog-title
    class="w-full flex justify-center items-center min-h-14 max-h-14 h-14 border-b border-slate-200 dark:border-white/10 m-0 !py-0 font-kantumruy bg-white dark:bg-slate-900">
    <span
        class="w-full text-center text-2xl font-medium font-kantumruy text-slate-500 dark:text-slate-400">{{ 'ProfileSecurity.Title' | transloco }}</span>
</div>

<shared-side-dialog-close-button [isReturn]="true"></shared-side-dialog-close-button>

<mat-dialog-content class="flex-1 !p-0 !m-0 bg-white dark:bg-slate-900 font-kantumruy">
    <div class="dialog-page">
        @if (isLoading()) {
        <div class="security-skeleton" role="status" [attr.aria-label]="'ProfileSecurity.LoadingAriaLabel' | transloco">
            <div class="banner-card" aria-hidden="true">
                <span class="skeleton-block skeleton-ring"></span>
                <div class="skeleton-copy">
                    <span class="skeleton-block h-5 w-3/5"></span>
                    <span class="skeleton-block h-3.5 w-4/5"></span>
                </div>
            </div>

            <div class="list-section" aria-hidden="true">
                <div class="skeleton-row">
                    <span class="skeleton-block skeleton-icon"></span>
                    <div class="skeleton-copy">
                        <span class="skeleton-block h-4 w-2/5"></span>
                        <span class="skeleton-block h-3 w-1/3"></span>
                    </div>
                    <span class="skeleton-block skeleton-action"></span>
                </div>
            </div>

            <div class="list-section" aria-hidden="true">
                <div class="skeleton-header">
                    <span class="skeleton-block h-5 w-2/5"></span>
                </div>
                @for (row of [0, 1, 2, 3]; track row) {
                <div class="skeleton-row">
                    <span class="skeleton-block skeleton-icon"></span>
                    <div class="skeleton-copy">
                        <span class="skeleton-block h-4 w-2/5"></span>
                        <span class="skeleton-block h-3 w-1/2"></span>
                    </div>
                    <span class="skeleton-block skeleton-action"></span>
                </div>
                }
            </div>

            @for (section of [0, 1]; track section) {
            <div class="list-section" aria-hidden="true">
                <div class="skeleton-row">
                    <span class="skeleton-block skeleton-icon"></span>
                    <div class="skeleton-copy">
                        <span class="skeleton-block h-4 w-1/3"></span>
                        <span class="skeleton-block h-3 w-1/2"></span>
                    </div>
                    <span class="skeleton-block skeleton-action"></span>
                </div>
            </div>
            }
        </div>
        } @else {

        <!-- ─── Security Status Banner Card ─────────────────── -->
        <div class="banner-card">
            <div class="ring-wrap flex-shrink-0" [ngStyle]="{ background: drawSecurityStatus()?.style }">
                <div class="ring-inner">
                    <mat-icon class="icon-size-10" [ngStyle]="{ color: drawSecurityStatus()?.color }"
                        svgIcon="mdi:shield-check"></mat-icon>
                </div>
            </div>
            <div class="flex flex-col gap-1 min-w-0">
                <span class="text-[20px] font-medium text-slate-900 dark:text-slate-100 font-kantumruy leading-tight">{{
                    drawSecurityStatus()?.status }}</span>
                <span class="text-[14px] text-slate-500 dark:text-slate-400 font-kantumruy leading-snug">{{
                    drawSecurityStatus()?.description }}</span>
            </div>
        </div>

        <!-- ─── Password / Local Passcode / Passkey Section ──── -->
        <div class="list-section">
            <!-- Password -->
            <button type="button" class="list-row" (click)="openPasswordDialog()">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mdi:lock-outline"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.Password' | transloco }}</span>
                    <span class="row-sub">{{ passwordSubLabel() }}</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="isPasswordOld()" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon *ngIf="!isPasswordOld()" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>

            <!-- Local Passcode -->
            <button type="button" class="list-row" (click)="openLocalPasscodeDialog()">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mdi:lock-clock"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.LocalPasscode' | transloco }}</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="isLocalPasscodeEnabled()" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon *ngIf="!isLocalPasscodeEnabled()" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>

            <!-- Passkey -->
            <button type="button" class="list-row last" (click)="openPasskeyDialog()">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mdi:fingerprint"></mat-icon>
                <div class="row-body">
                    <span class="row-title">Passkeys</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="passkeyCount() > 0" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon *ngIf="passkeyCount() === 0" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>
        </div>

        <!-- ─── 2FA Section ────────────────────────────────────── -->
        <div class="list-section">
            <div class="section-header">{{ 'ProfileSecurity.TwoFactorSection' | transloco }}</div>

            <!-- Phone -->
            <button type="button" class="list-row" (click)="openVerifyIdentityDialog('phone')">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mdi:phone-outline"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.Phone' | transloco }}</span>
                    <span *ngIf="twoFactor().phone && (twoFactor().security_phone || user.phone)" class="row-sub truncate">{{ maskedPhone() || twoFactor().security_phone || user.phone }}</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="twoFactor().phone" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon *ngIf="!twoFactor().phone" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>

            <!-- Telegram -->
            <button type="button" class="list-row" (click)="openTelegramDialog()">
                <mat-icon class="row-icon" svgIcon="logos:telegram"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.Telegram' | transloco }}</span>
                    <span *ngIf="twoFactor().telegram && (user.phone || telegramLinked())" class="row-sub truncate">{{ telegramLinked() ? ('@' + (telegramUsername() || '')) : (maskedPhone() || user.phone) }}</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="twoFactor().telegram" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon *ngIf="!twoFactor().telegram" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>

            <!-- Email -->
            <button type="button" class="list-row" (click)="openVerifyIdentityDialog('email')">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mdi:email-outline"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.Email' | transloco }}</span>
                    <span *ngIf="twoFactor().email && (twoFactor().security_email || user.email)" class="row-sub truncate">{{ maskedEmail() || twoFactor().security_email || user.email }}</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="twoFactor().email" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon *ngIf="!twoFactor().email" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>

            <!-- Google Authenticator -->
            <button type="button" class="list-row last" (click)="openGoogleAuthenticatorDialog()">
                <mat-icon class="row-icon" svgIcon="google-authenticator-colored"></mat-icon>
                <div class="row-body">
                    <span class="row-title">Google Authenticator</span>
                </div>
                <div class="row-end">
                    <mat-icon *ngIf="twoFactor().authenticator" class="icon-size-5 text-green-500 mr-1"
                        svgIcon="mdi:check-circle"></mat-icon>
                    <mat-icon *ngIf="!twoFactor().authenticator" class="icon-size-5 text-amber-500 mr-1"
                        svgIcon="mdi:alert-circle"></mat-icon>
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>
        </div>

        <!-- ─── Devices Section ────────────────────────────────── -->
        <div class="list-section">
            <button type="button" class="list-row last" (click)="openDeviceDialog()">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mat_outline:devices"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.Devices' | transloco }}</span>
                    <span class="row-sub">{{ deviceCountLabel() }}</span>
                </div>
                <div class="row-end">
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>
        </div>

        <!-- ─── Login History Section ──────────────────────────── -->
        <div class="list-section">
            <button type="button" class="list-row last" (click)="openLoginHistoryDialog()">
                <mat-icon class="row-icon text-slate-500 dark:text-slate-400" svgIcon="mdi:history"></mat-icon>
                <div class="row-body">
                    <span class="row-title">{{ 'ProfileSecurity.LoginHistory' | transloco }}</span>
                    <span class="row-sub truncate">{{ latestLoginSummary() }}</span>
                </div>
                <div class="row-end">
                    <mat-icon class="icon-size-5 text-slate-400 dark:text-slate-500"
                        svgIcon="mdi:chevron-right"></mat-icon>
                </div>
            </button>
        </div>
        }

    </div>
</mat-dialog-content>
