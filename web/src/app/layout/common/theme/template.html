<!-- Segmented switch: primary color swatches -->
<div
    class="inline-flex items-center gap-0.5 p-0.5 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700"
>
    @for (option of options; track option) {
        <button
            type="button"
            (click)="setTheme(option.value)"
            [matTooltip]="option.label_en"
            class="flex items-center justify-center w-8 h-8 rounded-full transition-colors duration-200"
            [ngClass]="
                theme === option.value
                    ? 'bg-primary/10 shadow-sm'
                    : 'hover:bg-gray-200 dark:hover:bg-gray-700'
            "
        >
            <span
                class="flex items-center justify-center w-5 h-5 rounded-full"
                [style.background-color]="swatchColor(option)"
            >
                @if (theme === option.value) {
                    <mat-icon class="icon-size-4 !text-white" svgIcon="mdi:check"></mat-icon>
                }
            </span>
        </button>
    }

    <!-- Custom color: opens a picker so the user isn't limited to the presets above. -->
    <button
        type="button"
        (click)="openCustomColorPicker()"
        [matTooltip]="'Custom'"
        class="flex items-center justify-center w-8 h-8 rounded-full transition-colors duration-200"
        [ngClass]="
            theme === 'theme-custom'
                ? 'bg-primary/10 shadow-sm'
                : 'hover:bg-gray-200 dark:hover:bg-gray-700'
        "
    >
        <span
            class="flex items-center justify-center w-5 h-5 rounded-full"
            [ngStyle]="
                theme === 'theme-custom' && customColor
                    ? { 'background-color': customColor }
                    : { background: 'conic-gradient(red, yellow, lime, cyan, blue, magenta, red)' }
            "
        >
            @if (theme === 'theme-custom' && customColor) {
                <mat-icon class="icon-size-4 !text-white" svgIcon="mdi:check"></mat-icon>
            }
        </span>
    </button>
</div>
