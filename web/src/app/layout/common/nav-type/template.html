<!-- Segmented switch: Compact / Classic -->
<div
    class="inline-flex items-center gap-0.5 p-0.5 rounded-full bg-gray-100 dark:bg-gray-800 border border-gray-200 dark:border-gray-700"
>
    @for (option of options; track option.value) {
        <button
            type="button"
            (click)="setLayout(option.value)"
            [matTooltip]="option.label_en"
            class="flex items-center justify-center w-8 h-8 rounded-full transition-colors duration-200"
            [ngClass]="
                layout === option.value
                    ? 'bg-primary/10 shadow-sm !text-primary'
                    : '!text-gray-500 dark:!text-gray-400 hover:bg-gray-200 dark:hover:bg-gray-700'
            "
        >
            <mat-icon class="icon-size-5" [svgIcon]="option.icon"></mat-icon>
        </button>
    }
</div>
