# ===================================================
# Upstream Pools for Load Balancing
# ===================================================

# NestJS Backend API Upstream
upstream api_backend_pool {
    # Algorithm: least_conn routes traffic to the backend instance with the fewest active connections
    least_conn;

    # In Docker Compose, the service name 'api' resolves to all scaled replica instances
    server api:3000 max_fails=3 fail_timeout=10s;

    # Keepalive connections to upstream servers
    keepalive 32;
}

# Angular Frontend Web Upstream
upstream web_frontend_pool {
    server web:80 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

# ===================================================
# Load Balancer / Reverse Proxy Server Block
# ===================================================
server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 1. Health check endpoint for Load Balancer monitoring
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"load-balancer","timestamp":"$time_iso8601"}\n';
    }

    # 2. WebSocket Support (Socket.IO / Real-time notifications)
    location /socket.io/ {
        proxy_pass http://api_backend_pool;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # 3. NestJS API Routes (/api/*)
    location /api/ {
        # Apply rate limiting
        limit_req zone=api_rate_limit burst=50 nodelay;
        limit_conn addr_limit 20;

        proxy_pass http://api_backend_pool;
        proxy_http_version 1.1;

        # Connection handling
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts & buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Next upstream failover conditions
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # 4. Storage / Uploads (if served directly through API)
    location /storage/ {
        proxy_pass http://api_backend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. Angular Frontend SPA
    location / {
        proxy_pass http://web_frontend_pool;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Proxy buffer settings
        proxy_buffer_size 64k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 128k;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
