# ===================================================
# Dynamic Reverse Proxy Gateway (DIGITECHKH WMS)
# Upstreams are resolved dynamically via Docker DNS (127.0.0.11)
# ===================================================
# Load Balancer / Reverse Proxy Server Block
# ===================================================
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker Embedded DNS Resolver with 5s TTL
    # Dynamically refreshes container IPs so rebuilds never cause 502 Bad Gateway
    resolver 127.0.0.11 valid=5s ipv6=off;
    resolver_timeout 5s;

    # 1. Health check endpoint for Load Balancer monitoring
    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"healthy","service":"load-balancer","timestamp":"$time_iso8601"}\n';
    }

    # 2. WebSocket Support (Socket.IO / Real-time notifications)
    location /socket.io/ {
        set $api_upstream "http://api:3000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # WebSocket headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard Forwarding Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # WebSocket timeouts
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_connect_timeout 60s;
    }

    # 3. NestJS API Routes (/api/*)
    location /api/ {
        # Apply rate limiting
        limit_req zone=api_rate_limit burst=100 nodelay;
        limit_conn addr_limit 50;

        set $api_upstream "http://api:3000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # Connection handling
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Proxy timeouts & buffers
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;

        # Next upstream failover conditions
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 10s;
    }

    # 4. Storage / Uploads (if served directly through API)
    location /storage/ {
        set $api_upstream "http://api:3000";
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # 5. Angular Frontend SPA
    location / {
        set $web_upstream "http://web:80";
        proxy_pass $web_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Proxy buffer settings
        proxy_buffer_size 64k;
        proxy_buffers 4 128k;
        proxy_busy_buffers_size 128k;
    }

    # Error Pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
