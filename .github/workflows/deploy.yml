name: Deploy main to NAS

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "web/**"
      - "nginx/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: Container to rebuild
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - web

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: digitechkh-wms
  DOCKER_API_VERSION: "1.43"

concurrency:
  group: digitechkh-wms-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Rebuild changed containers on NAS
    runs-on:
      - self-hosted
      - nas-wms
    environment: production_ENV
    timeout-minutes: 30

    steps:
      - name: Record Start Time
        id: start_time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Notify Telegram Deployment Started
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ⏳ <b>${{ github.actor }}</b> started deployment for <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.event.repository.name }}</a>
            📦 Branch: <code>${{ github.ref_name }}</code> | Commit: <a href="${{ github.event.compare || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}">${{ github.sha }}</a>
            🛠️ Rebuilding containers on Synology NAS...

      - name: Checkout main commit
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select containers to rebuild
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SELECTED_SERVICE: ${{ inputs.service }}
        run: |
          rebuild_api=false
          rebuild_web=false
          reload_gateway=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$SELECTED_SERVICE" in
              api) rebuild_api=true ;;
              web) rebuild_web=true ;;
              both) rebuild_api=true; rebuild_web=true ;;
            esac
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            rebuild_api=true
            rebuild_web=true
            reload_gateway=true
          else
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/wms-changed-files.txt"

            while IFS= read -r changed_file; do
              case "$changed_file" in
                api/*) rebuild_api=true ;;
                web/*) rebuild_web=true ;;
                nginx/*) reload_gateway=true ;;
                docker-compose.yml)
                  rebuild_api=true
                  rebuild_web=true
                  reload_gateway=true
                  ;;
              esac
            done < "$RUNNER_TEMP/wms-changed-files.txt"
          fi

          echo "api=$rebuild_api" >> "$GITHUB_OUTPUT"
          echo "web=$rebuild_web" >> "$GITHUB_OUTPUT"
          echo "gateway=$reload_gateway" >> "$GITHUB_OUTPUT"
          echo "API rebuild: $rebuild_api"
          echo "Web rebuild: $rebuild_web"
          echo "Gateway reload: $reload_gateway"

      - name: Create protected production environment file
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "::error::PRODUCTION_ENV_FILE is missing from the GitHub production environment secrets." >&2
            exit 1
          fi

          umask 077
          printf '%s\n' "$PRODUCTION_ENV_FILE" > .env
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/wms-production.env"

      - name: Validate production Compose configuration
        shell: bash
        run: >-
          docker compose
          --project-name "$COMPOSE_PROJECT_NAME"
          --env-file "$RUNNER_TEMP/wms-production.env"
          -f docker-compose.yml
          config --quiet

      - name: Verify existing production data volumes
        shell: bash
        run: |
          docker volume inspect "${COMPOSE_PROJECT_NAME}_postgres_data" >/dev/null
          echo "Using existing database volume: ${COMPOSE_PROJECT_NAME}_postgres_data"
          if docker volume inspect "${COMPOSE_PROJECT_NAME}_redis_data" >/dev/null 2>&1; then
            echo "Using existing redis volume: ${COMPOSE_PROJECT_NAME}_redis_data"
          fi

      - name: Build selected containers
        shell: bash
        env:
          REBUILD_API: ${{ steps.changes.outputs.api }}
          REBUILD_WEB: ${{ steps.changes.outputs.web }}
        run: |
          services=()
          [ "$REBUILD_API" = "true" ] && services+=(api)
          [ "$REBUILD_WEB" = "true" ] && services+=(web)

          if [ "${#services[@]}" -eq 0 ]; then
            echo "No API or Web changes require a rebuild."
            exit 0
          fi

          echo "Building services: ${services[*]}"
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$RUNNER_TEMP/wms-production.env" \
            -f docker-compose.yml \
            build "${services[@]}"

      - name: Restart selected containers
        shell: bash
        env:
          REBUILD_API: ${{ steps.changes.outputs.api }}
          REBUILD_WEB: ${{ steps.changes.outputs.web }}
          RELOAD_GATEWAY: ${{ steps.changes.outputs.gateway }}
        run: |
          services=()
          [ "$REBUILD_API" = "true" ] && services+=(api)
          [ "$REBUILD_WEB" = "true" ] && services+=(web)

          if [ "${#services[@]}" -eq 0 ] && [ "$RELOAD_GATEWAY" != "true" ]; then
            echo "No services need to be recreated."
            exit 0
          fi

          # Always restart load_balancer so Nginx immediately refreshes upstream container IPs
          services+=(load_balancer)

          echo "Restarting services: ${services[*]}"
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$RUNNER_TEMP/wms-production.env" \
            -f docker-compose.yml \
            up -d --no-build --remove-orphans "${services[@]}"

      - name: Show deployed container status
        shell: bash
        run: >-
          docker compose
          --project-name "$COMPOSE_PROJECT_NAME"
          --env-file "$RUNNER_TEMP/wms-production.env"
          -f docker-compose.yml
          ps

      - name: Remove dangling Docker images
        run: docker image prune --force

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f "$RUNNER_TEMP/wms-production.env"
          rm -f "$RUNNER_TEMP/wms-changed-files.txt"

      - name: Calculate Duration
        if: always()
        id: duration
        run: |
          end_epoch=$(date +%s)
          start_epoch=${{ steps.start_time.outputs.start_epoch || 0 }}
          diff=$((end_epoch - start_epoch))
          mins=$(printf "%02d" $((diff / 60)))
          secs=$(printf "%02d" $((diff % 60)))
          echo "formatted=${mins}:${secs}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------
      # Telegram: Success Notification
      # ----------------------------------------------------
      - name: Notify Telegram on Success
        if: success()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ✅ <b>${{ github.event.repository.name }}</b> deployed successfully to Synology NAS!
            🚀 Pipeline <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a> of <b>${{ github.ref_name }}</b> passed in ${{ steps.duration.outputs.formatted }}.
            🌐 Gateway: Port <code>4500</code>

      # ----------------------------------------------------
      # Telegram: Failure Notification
      # ----------------------------------------------------
      - name: Notify Telegram on Failure
        if: failure()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ❌ <b>${{ github.event.repository.name }}</b> NAS deployment failed!
            ⚠️ Pipeline <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a> of <b>${{ github.ref_name }}</b> failed after ${{ steps.duration.outputs.formatted }}.
