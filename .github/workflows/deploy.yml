name: Deploy main to NAS

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "web/**"
      - "nginx/**"
      - "docker-compose.yml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:
    inputs:
      service:
        description: Container to rebuild
        required: true
        default: both
        type: choice
        options:
          - both
          - api
          - web

permissions:
  contents: read

env:
  COMPOSE_PROJECT_NAME: digitechkh-wms
  DOCKER_API_VERSION: "1.43"

concurrency:
  group: digitechkh-wms-production
  cancel-in-progress: false

jobs:
  deploy-production:
    name: Rebuild changed containers on NAS
    runs-on:
      - self-hosted
      - nas-wms
    environment: production_ENV
    timeout-minutes: 30

    steps:
      - name: Record Start Time
        id: start_time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------
      # 1. Telegram Event: Push / Merge
      # ----------------------------------------------------
      - name: Notify Telegram Push or Merge Event
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_TO }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing in GitHub secrets."
            exit 0
          fi
          COMMIT_MSG="${{ github.event.head_commit.message }}"
          ICON="🚀"
          ACTION="pushed to"
          if [[ "$COMMIT_MSG" == *"Merge"* ]]; then
            ICON="🔀"
            ACTION="merged into"
          fi
          MSG="${ICON} <b>${{ github.actor }}</b> ${ACTION} <code>${{ github.ref_name }}</code> in <a href=\"${{ github.server_url }}/${{ github.repository }}\">${{ github.event.repository.name }}</a>%0A📦 Commit: <a href=\"${{ github.event.compare || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}\">${{ github.sha }}</a>"
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}")
          echo "Telegram response: $RESPONSE"

      - name: Fix runner workspace permissions and migrate legacy uploads
        continue-on-error: true
        shell: bash
        run: |
          WS="${{ github.workspace }}"
          [ -z "$WS" ] && WS="$PWD"
          echo "Checking workspace permissions at: $WS"

          # 1. Migrate legacy host uploads into the dedicated Docker named volume if it exists
          if [ -d "$WS/uploads" ]; then
            echo "Migrating $WS/uploads into digitechkh-wms_uploads_data volume..."
            docker volume create digitechkh-wms_uploads_data 2>/dev/null || true
            docker run --rm -v "$WS/uploads":/src -v digitechkh-wms_uploads_data:/dst alpine sh -c "cp -rn /src/* /dst/ 2>/dev/null || true" 2>/dev/null || true
            echo "Purging legacy host uploads directory using Docker (root)..."
            docker run --rm -v "$WS":/ws alpine rm -rf /ws/uploads 2>/dev/null || true
          fi

          # 2. Direct cleanups fallback
          sudo rm -rf "$WS/uploads" 2>/dev/null || true
          rm -rf "$WS/uploads" 2>/dev/null || true

          # 3. Ensure runner user owns all workspace files to prevent git checkout EACCES errors
          docker run --rm -v "$WS":/ws alpine chown -R $(id -u):$(id -g) /ws 2>/dev/null || true
          sudo chown -R $(id -u):$(id -g) "$WS" 2>/dev/null || true

      - name: Checkout main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          clean: false

      - name: Select containers to rebuild
        id: changes
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
          SELECTED_SERVICE: ${{ inputs.service }}
        run: |
          rebuild_api=false
          rebuild_web=false
          reload_gateway=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$SELECTED_SERVICE" in
              api) rebuild_api=true ;;
              web) rebuild_web=true ;;
              both) rebuild_api=true; rebuild_web=true ;;
            esac
          elif [ -z "$BEFORE_SHA" ] || [ "$BEFORE_SHA" = "0000000000000000000000000000000000000000" ]; then
            rebuild_api=true
            rebuild_web=true
            reload_gateway=true
          else
            git diff --name-only "$BEFORE_SHA" "$GITHUB_SHA" > "$RUNNER_TEMP/wms-changed-files.txt"

            while IFS= read -r changed_file; do
              case "$changed_file" in
                api/*) rebuild_api=true ;;
                web/*) rebuild_web=true ;;
                nginx/*) reload_gateway=true ;;
                docker-compose.yml)
                  rebuild_api=true
                  rebuild_web=true
                  reload_gateway=true
                  ;;
              esac
            done < "$RUNNER_TEMP/wms-changed-files.txt"
          fi

          if [ "$rebuild_api" = "true" ] && [ "$rebuild_web" = "true" ]; then
            target="Both (API & Web)"
          elif [ "$rebuild_api" = "true" ]; then
            target="API Service (NestJS)"
          elif [ "$rebuild_web" = "true" ]; then
            target="Web Frontend (Angular)"
          else
            target="Gateway / Config Only"
          fi

          echo "api=$rebuild_api" >> "$GITHUB_OUTPUT"
          echo "web=$rebuild_web" >> "$GITHUB_OUTPUT"
          echo "gateway=$reload_gateway" >> "$GITHUB_OUTPUT"
          echo "target=$target" >> "$GITHUB_OUTPUT"
          echo "Target: $target"

      # ----------------------------------------------------
      # 2. Telegram Event: Pipeline Running
      # ----------------------------------------------------
      - name: Notify Telegram Pipeline Running
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_TO }}
          TARGET: ${{ steps.changes.outputs.target }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi
          MSG="⏳ <a href=\"${{ github.server_url }}/${{ github.repository }}\">${{ github.event.repository.name }}</a>: Pipeline <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} is <b>running</b> (<code>${TARGET}</code>)..."
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}")
          echo "Telegram response: $RESPONSE"

      - name: Create protected production environment file
        shell: bash
        env:
          PRODUCTION_ENV_FILE: ${{ secrets.PRODUCTION_ENV_FILE }}
        run: |
          if [ -z "$PRODUCTION_ENV_FILE" ]; then
            echo "::error::PRODUCTION_ENV_FILE is missing from the GitHub production environment secrets." >&2
            exit 1
          fi

          umask 077
          printf '%s\n' "$PRODUCTION_ENV_FILE" > .env
          printf '%s\n' "$PRODUCTION_ENV_FILE" > "$RUNNER_TEMP/wms-production.env"

      - name: Validate production Compose configuration
        shell: bash
        run: >-
          docker compose
          --project-name "$COMPOSE_PROJECT_NAME"
          --env-file "$RUNNER_TEMP/wms-production.env"
          -f docker-compose.yml
          config --quiet

      - name: Verify shared database and redis services
        shell: bash
        run: |
          docker inspect postgres18 >/dev/null 2>&1 || {
            echo "::error::Shared database container 'postgres18' is not running on the NAS!" >&2
            exit 1
          }
          docker inspect shared-redis >/dev/null 2>&1 || {
            echo "::error::Shared cache container 'shared-redis' is not running on the NAS!" >&2
            exit 1
          }
          echo "Verified shared infrastructure (postgres18 & shared-redis) is active."

      - name: Build selected containers
        shell: bash
        env:
          REBUILD_API: ${{ steps.changes.outputs.api }}
          REBUILD_WEB: ${{ steps.changes.outputs.web }}
        run: |
          services=()
          [ "$REBUILD_API" = "true" ] && services+=(api)
          [ "$REBUILD_WEB" = "true" ] && services+=(web)

          if [ "${#services[@]}" -eq 0 ]; then
            echo "No API or Web changes require a rebuild."
            exit 0
          fi

          # 1. Pre-pull base images with retry to ensure local cache & avoid concurrent timeouts
          echo "Pre-pulling base images with retry..."
          for img in "public.ecr.aws/docker/library/node:20-alpine" "public.ecr.aws/docker/library/nginx:1.27-alpine"; do
            for attempt in 1 2 3; do
              echo "Pulling $img (attempt $attempt)..."
              if docker pull "$img"; then
                break
              fi
              echo "Pulling $img failed, retrying in 5s..."
              sleep 5
            done
          done

          # 2. Build selected containers with retry
          echo "Building services: ${services[*]}"
          build_success=false
          for attempt in 1 2 3; do
            echo "Executing docker compose build (attempt $attempt of 3)..."
            if docker compose \
              --project-name "$COMPOSE_PROJECT_NAME" \
              --env-file "$RUNNER_TEMP/wms-production.env" \
              -f docker-compose.yml \
              build "${services[@]}"; then
              build_success=true
              break
            fi
            echo "Build attempt $attempt failed, retrying in 10s..."
            sleep 10
          done

          if [ "$build_success" != "true" ]; then
            echo "::error::docker compose build failed after 3 attempts."
            exit 1
          fi

      - name: Restart selected containers
        shell: bash
        env:
          REBUILD_API: ${{ steps.changes.outputs.api }}
          REBUILD_WEB: ${{ steps.changes.outputs.web }}
          RELOAD_GATEWAY: ${{ steps.changes.outputs.gateway }}
        run: |
          services=()
          [ "$REBUILD_API" = "true" ] && services+=(api)
          [ "$REBUILD_WEB" = "true" ] && services+=(web)

          if [ "${#services[@]}" -eq 0 ] && [ "$RELOAD_GATEWAY" != "true" ]; then
            echo "No services need to be recreated."
            exit 0
          fi

          # Always restart load_balancer so Nginx immediately refreshes upstream container IPs
          services+=(load_balancer)

          echo "Restarting services: ${services[*]}"
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$RUNNER_TEMP/wms-production.env" \
            -f docker-compose.yml \
            up -d --no-build --remove-orphans "${services[@]}"

          # Force Nginx restart so changes in nginx/conf.d take effect immediately
          echo "Restarting Nginx load_balancer..."
          docker compose \
            --project-name "$COMPOSE_PROJECT_NAME" \
            --env-file "$RUNNER_TEMP/wms-production.env" \
            -f docker-compose.yml \
            restart load_balancer || true

      - name: Show deployed container status
        shell: bash
        run: >-
          docker compose
          --project-name "$COMPOSE_PROJECT_NAME"
          --env-file "$RUNNER_TEMP/wms-production.env"
          -f docker-compose.yml
          ps

      - name: Remove dangling Docker images
        run: docker image prune --force

      - name: Remove temporary files
        if: always()
        shell: bash
        run: |
          rm -f .env
          rm -f "$RUNNER_TEMP/wms-production.env"
          rm -f "$RUNNER_TEMP/wms-changed-files.txt"

      - name: Calculate Duration
        if: always()
        id: duration
        shell: bash
        run: |
          end_epoch=$(date +%s)
          start_epoch="${{ steps.start_time.outputs.start_epoch }}"
          if [ -z "$start_epoch" ] || ! [[ "$start_epoch" =~ ^[0-9]+$ ]]; then
            start_epoch=$end_epoch
          fi
          diff=$((end_epoch - start_epoch))
          mins=$(printf "%02d" $((diff / 60)))
          secs=$(printf "%02d" $((diff % 60)))
          echo "formatted=${mins}:${secs}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------
      # 3. Telegram: Passed / Success Notification
      # ----------------------------------------------------
      - name: Notify Telegram on Success
        if: success()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_TO }}
          DURATION: ${{ steps.duration.outputs.formatted || '00:00' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi
          MSG="✅ <a href=\"${{ github.server_url }}/${{ github.repository }}\">${{ github.event.repository.name }}</a>: Pipeline <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} has <b>passed</b> in ${DURATION} 🚀"
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}")
          echo "Telegram response: $RESPONSE"

      # ----------------------------------------------------
      # 4. Telegram: Failure Notification
      # ----------------------------------------------------
      - name: Notify Telegram on Failure
        if: failure()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_TO }}
          DURATION: ${{ steps.duration.outputs.formatted || '00:00' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi
          MSG="❌ <a href=\"${{ github.server_url }}/${{ github.repository }}\">${{ github.event.repository.name }}</a>: Pipeline <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} has <b>failed</b> in ${DURATION}"
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}")
          echo "Telegram response: $RESPONSE"

      # ----------------------------------------------------
      # 5. Telegram: Cancelled Notification
      # ----------------------------------------------------
      - name: Notify Telegram on Cancelled
        if: cancelled()
        continue-on-error: true
        shell: bash
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_TO }}
          DURATION: ${{ steps.duration.outputs.formatted || '00:00' }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "::warning::Telegram notification skipped: TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is missing."
            exit 0
          fi
          MSG="⚠️ <a href=\"${{ github.server_url }}/${{ github.repository }}\">${{ github.event.repository.name }}</a>: Pipeline <a href=\"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} was <b>cancelled</b> after ${DURATION}"
          RESPONSE=$(curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_CHAT_ID}" \
            -d "parse_mode=HTML" \
            -d "disable_web_page_preview=true" \
            -d "text=${MSG}")
          echo "Telegram response: $RESPONSE"
