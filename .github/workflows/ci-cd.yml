name: CI/CD Pipeline & Notification

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Record Start Time
        id: start_time
        run: echo "start_epoch=$(date +%s)" >> "$GITHUB_OUTPUT"

      - name: Checkout Code
        uses: actions/checkout@v4

      # ----------------------------------------------------
      # Push Event Notification
      # ----------------------------------------------------
      - name: Notify Telegram Push Event
        if: github.event_name == 'push'
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            🚀 <b>${{ github.actor }}</b> pushed to <code>${{ github.ref_name }}</code> in <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.event.repository.name }}</a>
            📦 Commit: <a href="${{ github.event.compare || format('{0}/{1}/commit/{2}', github.server_url, github.repository, github.sha) }}">${{ github.sha }}</a>

      # ----------------------------------------------------
      # Pipeline Event: Running
      # ----------------------------------------------------
      - name: Notify Telegram Pipeline Running
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ⏳ <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.event.repository.name }}</a>: Pipeline <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} is <b>running</b>...

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Build API
        run: |
          cd api
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build

      - name: Install & Build Web
        run: |
          cd web
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
        env:
          API_BASE_URL: "https://structure-project.onrender.com/api"
          FILE_BASE_URL: "https://file-v4-api.uat.camcyber.com"
          SOCKET_URL: "https://structure-project.onrender.com"
          GOOGLE_CLIENT_ID: "54356070191-kacqa35o9tefnughhdgi5b6jkhshso2c.apps.googleusercontent.com"

      - name: Calculate Duration
        if: always()
        id: duration
        run: |
          end_epoch=$(date +%s)
          start_epoch=${{ steps.start_time.outputs.start_epoch }}
          diff=$((end_epoch - start_epoch))
          mins=$(printf "%02d" $((diff / 60)))
          secs=$(printf "%02d" $((diff % 60)))
          echo "formatted=${mins}:${secs}" >> "$GITHUB_OUTPUT"

      # ----------------------------------------------------
      # Pipeline Event: Passed / Success
      # ----------------------------------------------------
      - name: Notify Telegram on Success
        if: success()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ✅ <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.event.repository.name }}</a>: Pipeline <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} has <b>passed</b> in ${{ steps.duration.outputs.formatted }} 🚀

      # ----------------------------------------------------
      # Pipeline Event: Failed
      # ----------------------------------------------------
      - name: Notify Telegram on Failure
        if: failure()
        continue-on-error: true
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          format: html
          disable_web_page_preview: true
          message: |
            ❌ <a href="${{ github.server_url }}/${{ github.repository }}">${{ github.event.repository.name }}</a>: Pipeline <a href="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">#${{ github.run_number }}</a> of branch <b>${{ github.ref_name }}</b> by ${{ github.actor }} has <b>failed</b> in ${{ steps.duration.outputs.formatted }}
