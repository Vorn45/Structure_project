services:
  # ===================================================
  # Nginx Reverse Proxy & Load Balancer Gateway
  # ===================================================
  load_balancer:
    image: nginx:1.27-alpine
    container_name: wfm_load_balancer
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-4500}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ===================================================
  # NestJS Backend API Service (Scalable Replicas)
  # ===================================================
  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app_network
    expose:
      - "3000"

  # ===================================================
  # Angular Frontend Web Application
  # ===================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_network
    expose:
      - "80"

  # ===================================================
  # PostgreSQL Database Service
  # ===================================================
  postgres:
    image: postgres:16-alpine
    container_name: wfm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:?DB_USERNAME is required in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required in .env}
      POSTGRES_DB: ${DB_DATABASE:?DB_DATABASE is required in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - app_network
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ===================================================
  # Redis Cache & Session Store
  # ===================================================
  redis:
    image: redis:7-alpine
    container_name: wfm_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - app_network
    ports:
      - "${REDIS_EXTERNAL_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

networks:
  app_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
