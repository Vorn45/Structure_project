services:
  # ===================================================
  # Nginx Reverse Proxy & Load Balancer Gateway
  # ===================================================
  load_balancer:
    container_name: digitechkh-wms-load_balancer
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${PORT_HTTP:-4500}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      api:
        condition: service_started
      web:
        condition: service_started
    networks:
      - app_network
    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  # ===================================================
  # NestJS Backend API Service (Scalable Replicas)
  # ===================================================
  api:
    container_name: digitechkh-wms-api
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app_network
    expose:
      - "3000"

  # ===================================================
  # Angular Frontend Web Application
  # ===================================================
  web:
    container_name: digitechkh-wms-web
    build:
      context: ./web
      dockerfile: Dockerfile
    restart: unless-stopped
    networks:
      - app_network
    expose:
      - "80"

networks:
  app_network:
    driver: bridge
