<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>File Service V3 Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #4f46e5;
      --primary-hover: #4338ca;
      --bg: #0b0f19;
      --card-bg: rgba(23, 30, 49, 0.85);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --success: #10b981;
      --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at 50% 0%, #1a1f38 0%, var(--bg) 75%);
      color: var(--text);
      min-height: 100vh;
      padding: 2rem 1.5rem;
    }
    .container {
      max-width: 960px;
      margin: 0 auto;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 2rem;
      padding-bottom: 1rem;
      border-bottom: 1px solid var(--border);
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      font-size: 1.4rem;
      font-weight: 700;
    }
    .badge {
      background: rgba(79, 70, 229, 0.2);
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.3);
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 0.75rem;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      padding: 24px;
      margin-bottom: 2rem;
      box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.5);
    }
    .dropzone {
      border: 2px dashed rgba(129, 140, 248, 0.35);
      border-radius: 12px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      background: rgba(79, 70, 229, 0.03);
      transition: all 0.2s ease;
    }
    .dropzone:hover, .dropzone.dragover {
      border-color: var(--primary);
      background: rgba(79, 70, 229, 0.08);
      transform: scale(1.005);
    }
    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 10px 20px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 0.9rem;
    }
    .btn:hover {
      background: var(--primary-hover);
    }
    .file-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 16px;
      margin-top: 1rem;
    }
    .file-card {
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      transition: transform 0.2s;
    }
    .file-card:hover {
      transform: translateY(-2px);
      border-color: rgba(255, 255, 255, 0.15);
    }
    .file-card-preview {
      height: 140px;
      border-radius: 8px;
      background: rgba(0, 0, 0, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    .file-card-preview img {
      max-width: 100%;
      max-height: 100%;
      object-fit: cover;
    }
    .file-name {
      font-size: 0.9rem;
      font-weight: 600;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .file-meta {
      font-size: 0.8rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }
    .file-actions {
      display: flex;
      gap: 8px;
      margin-top: auto;
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 6px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      flex: 1;
      justify-content: center;
    }
    .btn-outline {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text);
    }
    .btn-danger {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .btn-danger:hover {
      background: rgba(239, 68, 68, 0.3);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        File Service V3
        <span class="badge">TypeScript Express</span>
      </div>
      <div>
        <a href="/api/v1/health" target="_blank" style="color: #34d399; font-size: 0.85rem; text-decoration: none;">🟢 Health: Healthy</a>
      </div>
    </header>

    <div class="card">
      <h2 style="font-size: 1.15rem; margin-bottom: 1rem;">Upload File</h2>
      <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="#818cf8" stroke-width="2" style="margin-bottom: 12px;"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path><polyline points="17 8 12 3 7 8"></polyline><line x1="12" y1="3" x2="12" y2="15"></line></svg>
        <p style="font-weight: 600; margin-bottom: 4px;">Click or Drag & Drop to upload</p>
        <p style="font-size: 0.85rem; color: var(--text-muted);">Supports images, PDF, Docs, Zip (Max 50MB)</p>
        <input type="file" id="fileInput" multiple style="display: none" onchange="handleFileSelect(event)">
      </div>
      <div id="statusMessage" style="margin-top: 12px; font-size: 0.85rem;"></div>
    </div>

    <div class="card">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
        <h2 style="font-size: 1.15rem;">Stored Files (<span id="fileCount">0</span>)</h2>
        <button class="btn btn-outline" onclick="loadFiles()">🔄 Refresh</button>
      </div>
      <div id="filesContainer" class="file-grid"></div>
    </div>
  </div>

  <script>
    const dropzone = document.getElementById('dropzone');
    const statusMsg = document.getElementById('statusMessage');

    ['dragenter', 'dragover'].forEach(name => {
      dropzone.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.add('dragover'); });
    });
    ['dragleave', 'drop'].forEach(name => {
      dropzone.addEventListener(name, (e) => { e.preventDefault(); dropzone.classList.remove('dragover'); });
    });
    dropzone.addEventListener('drop', (e) => {
      const files = e.dataTransfer.files;
      if (files.length) uploadFiles(files);
    });

    function handleFileSelect(e) {
      if (e.target.files.length) uploadFiles(e.target.files);
    }

    async function uploadFiles(files) {
      statusMsg.innerHTML = '<span style="color:#60a5fa">⏳ Uploading...</span>';
      const formData = new FormData();
      if (files.length === 1) {
        formData.append('file', files[0]);
        try {
          const res = await fetch('/api/v1/files/upload', { method: 'POST', body: formData });
          const json = await res.json();
          if (json.success) {
            statusMsg.innerHTML = '<span style="color:#34d399">✓ File uploaded successfully!</span>';
            loadFiles();
          } else {
            statusMsg.innerHTML = `<span style="color:#f87171">✗ Error: ${json.message}</span>`;
          }
        } catch (err) {
          statusMsg.innerHTML = `<span style="color:#f87171">✗ Upload failed: ${err.message}</span>`;
        }
      } else {
        for (let i = 0; i < files.length; i++) {
          formData.append('files', files[i]);
        }
        try {
          const res = await fetch('/api/v1/files/upload-multiple', { method: 'POST', body: formData });
          const json = await res.json();
          if (json.success) {
            statusMsg.innerHTML = `<span style="color:#34d399">✓ ${json.data.total} files uploaded!</span>`;
            loadFiles();
          } else {
            statusMsg.innerHTML = `<span style="color:#f87171">✗ Error: ${json.message}</span>`;
          }
        } catch (err) {
          statusMsg.innerHTML = `<span style="color:#f87171">✗ Upload failed: ${err.message}</span>`;
        }
      }
    }

    async function loadFiles() {
      try {
        const res = await fetch('/api/v1/files');
        const json = await res.json();
        const files = json.data?.files || [];
        document.getElementById('fileCount').innerText = files.length;
        const container = document.getElementById('filesContainer');

        if (!files.length) {
          container.innerHTML = '<p style="color:var(--text-muted); grid-column: 1/-1;">No files uploaded yet.</p>';
          return;
        }

        container.innerHTML = files.map(file => {
          const isImg = file.mimeType.startsWith('image/');
          return `
            <div class="file-card">
              <div class="file-card-preview">
                ${isImg 
                  ? `<img src="${file.url}" alt="${file.originalName}" loading="lazy" />` 
                  : `<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#6b7280" stroke-width="1.5"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline></svg>`
                }
              </div>
              <div class="file-name" title="${file.originalName}">${file.originalName}</div>
              <div class="file-meta">
                <span>${file.formattedSize}</span>
                <span>${new Date(file.createdAt).toLocaleDateString()}</span>
              </div>
              <div class="file-actions">
                <a class="btn-sm btn-outline" href="${file.url}" target="_blank">Preview</a>
                <a class="btn-sm btn-outline" href="${file.downloadUrl}">Download</a>
                <button class="btn-sm btn-outline" onclick="renameFile('${file.id}', '${file.originalName.replace(/'/g, "\\'")}')">Rename</button>
                <button class="btn-sm btn-danger" onclick="deleteFile('${file.id}')">Delete</button>
              </div>
            </div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
      }
    }

    async function renameFile(id, currentName) {
      const newName = prompt('Enter new filename:', currentName);
      if (!newName || newName.trim() === '' || newName === currentName) return;
      try {
        const res = await fetch(`/api/v1/files/${id}/rename`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ newName: newName.trim() })
        });
        const json = await res.json();
        if (json.success) {
          loadFiles();
        } else {
          alert('Rename failed: ' + json.message);
        }
      } catch (err) {
        alert('Rename failed: ' + err.message);
      }
    }

    async function deleteFile(id) {
      if (!confirm('Are you sure you want to delete this file?')) return;
      try {
        const res = await fetch(`/api/v1/files/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (json.success) {
          loadFiles();
        } else {
          alert('Delete failed: ' + json.message);
        }
      } catch (err) {
        alert('Delete failed: ' + err.message);
      }
    }

    loadFiles();
  </script>
</body>
</html>
